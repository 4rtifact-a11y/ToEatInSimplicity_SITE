    <style>
      html {

      body {
        opacity: 0;

      body.loaded {

      /* Slide Animations for Lightbox */
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }

      @keyframes slideInLeft {

      .animate-slide-right {
        animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;

      .modal-enter {

      .modal-content-enter {

      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Poppins', 'sans-serif'],
              'serif': ['Playfair Display', 'serif'],
              'handwriting': ['Caveat', 'cursive'],

            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'slow-fade-in': 'fadeIn 1.5s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
               fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
          },
        },
      }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      
      const placeholderImage = "data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100' height='100' fill='%23E5E7EB'/%3E%3C/svg%3E";


      // --- Image Data ---
      const imageGallery = Array.from({ length: 22 }, (_, i) => `images/imageGrid${String(i + 1).padStart(5, '0')}.png`);
      
      const locationImages = imageGallery.slice(1, 10); // 00002 to 00010
      const salesImages = imageGallery.slice(10, 21);   // 00011 to 00021

      // --- Custom Hooks & Utilities ---
      const useInView = (options) => {
        const ref = useRef(null);
        const [isInView, setIsInView] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              setIsInView(true);
              if (ref.current) {
                observer.unobserve(ref.current);
              }
            }
          }, options);

          if (ref.current) {
            observer.observe(ref.current);
          }

          return () => {
            if (ref.current) {
              observer.unobserve(ref.current);
            }
          };
        }, [options]);

        return [ref, isInView];
      };
      
      const InteractiveSparkle = () => (
        <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="currentColor" />
        </svg>
      );

      const MagneticWrapper = ({
        children, className, mouseX, mouseY, magnetRadius = 150, magnetStrength = 0.4, easeFactor = 0.1,
      }) => {
        const ref = useRef(null);
        const [transform, setTransform] = useState({ x: 0, y: 0 });

        useEffect(() => {
          if (!ref.current) return;
          let targetX = 0;
          let targetY = 0;
          if (mouseX !== null && mouseY !== null) {
            const rect = ref.current.getBoundingClientRect();
            const elementX = rect.left + rect.width / 2;
            const elementY = rect.top + rect.height / 2;
            const deltaX = mouseX - elementX;
            const deltaY = mouseY - elementY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance < magnetRadius) {
              targetX = deltaX * magnetStrength;
              targetY = deltaY * magnetStrength;
            }
          }
          const animationFrame = requestAnimationFrame(() => {
            setTransform(prevTransform => ({
              x: prevTransform.x + (targetX - prevTransform.x) * easeFactor,
              y: prevTransform.y + (targetY - prevTransform.y) * easeFactor,
            }));
          });
          return () => cancelAnimationFrame(animationFrame);
        }, [mouseX, mouseY, magnetRadius, magnetStrength, easeFactor]);

        return (
          <div ref={ref} className={className} style={{ transform: `translate(${transform.x}px, ${transform.y}px)`, willChange: 'transform' }}>
            {children}
          </div>
        );
      };

      // --- Main Components ---

      const Lightbox = ({ images, initialIndex, onClose }) => {
        const [currentIndex, setCurrentIndex] = useState(initialIndex);
        const [direction, setDirection] = useState(null); 
        const touchStartX = useRef(null);
        const touchEndX = useRef(null);

        const handleNext = (e) => {
            if (e) e.stopPropagation();
            setDirection('next');
            setCurrentIndex((prev) => (prev + 1) % images.length);
        };

        const handlePrev = (e) => {
             if (e) e.stopPropagation();
             setDirection('prev');
             setCurrentIndex((prev) => (prev - 1 + images.length) % images.length);
        };

        const handleTouchStart = (e) => {
            touchStartX.current = e.targetTouches[0].clientX;
            touchEndX.current = null;
        };

        const handleTouchMove = (e) => {
            touchEndX.current = e.targetTouches[0].clientX;
        };

        const handleTouchEnd = () => {
            if (!touchStartX.current || !touchEndX.current) return;
            const distance = touchStartX.current - touchEndX.current;
            const minSwipeDistance = 50;

            if (distance > minSwipeDistance) {
                handleNext();
            } else if (distance < -minSwipeDistance) {
                handlePrev();
            }
            touchStartX.current = null;
            touchEndX.current = null;
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === 'Escape') onClose();
            if (e.key === 'ArrowLeft') handlePrev();
            if (e.key === 'ArrowRight') handleNext();
          };
          document.addEventListener('keydown', handleKeyDown);
          return () => document.removeEventListener('keydown', handleKeyDown);
        }, [images, onClose]);

        return (
            <div 
                className="fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4 backdrop-blur-sm animate-slow-fade-in touch-none" 
                onClick={onClose}
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
            >
                <button onClick={onClose} className="absolute top-6 right-6 text-white hover:text-brand-green transition-colors z-[110]" aria-label="Fermer">
                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg[...]
                </button>
                
                <button onClick={handlePrev} className="absolute left-6 text-white hover:text-brand-green transition-colors z-[110] hidden md:block" aria-label="Précédent">
                     <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
                </button>

                <div className="relative max-w-5xl max-h-full w-full h-full flex items-center justify-center overflow-hidden pointer-events-none">
                    <img 
                        key={currentIndex} 
                        src={images[currentIndex]} 
                        alt={`Agrandissement image ${currentIndex + 1}`} 
                        className={`max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl pointer-events-auto ${direction === 'next' ? 'animate-slide-right' : direction === 'prev' ? 'animate-sl[...]
                        onClick={(e) => e.stopPropagation()} 
                    />
                </div>

                <button onClick={handleNext} className="absolute right-6 text-white hover:text-brand-green transition-colors z-[110] hidden md:block" aria-label="Suivant">
                    <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                </button>
                
                <div className="absolute bottom-8 left-0 right-0 text-center text-white/90 text-sm font-sans tracking-widest font-bold">
                    {currentIndex + 1} <span className="text-white/40">/</span> {images.length}
                </div>
            </div>
        );
      };

      const Header = ({ mousePosition, route }) => {
        const [isOpen, setIsOpen] = useState(false);
        const [isScrolled, setIsScrolled] = useState(false);
        const [activeSection, setActiveSection] = useState('#home');
        
        const isHomePage = !route.startsWith('#contact') && !route.startsWith('#cgv');
        const useDarkText = isScrolled || isOpen || !isHomePage;

        const Logo = () => (
          <div className="flex items-center">
            <img src="images/logoTEIS.png" alt="To Eat In Simplicity Logo" className="h-[38px] w-[38px] object-contain" />
            <span className={`ml-2 text-xl md:text-base lg:text-xl font-bold transition-colors duration-300 ${useDarkText ? 'text-brand-dark' : 'text-white'}`}>To Eat In Simplicity</span>
          </div>
        );

        const navLinks = [
            { name: 'Accueil', href: '#home' },
            { name: 'Locations', href: '#location' },
            { name: 'Ventes', href: '#vente' },
            { name: 'Partenariats', href: '#partenariat' },
            { name: 'Agence', href: '#agence' },
        ];
        
        useEffect(() => {
          const handleScroll = () => setIsScrolled(window.scrollY > 50);
          window.addEventListener('scroll', handleScroll, { passive: true });
          handleScroll();
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        useEffect(() => {
          if (isHomePage) {
            const handleScrollSpy = () => {
                const sections = navLinks
                    .map(link => document.getElementById(link.href.split('#')[1]))
                    .filter(el => el);

                let currentSection = '';
                for (const section of sections) {
                    const sectionTop = section.offsetTop;
                    if (window.scrollY >= sectionTop - 100) {
                        currentSection = `#${section.id}`;
                    }
                }
                setActiveSection(currentSection || '#home');
            };
            
            window.addEventListener('scroll', handleScrollSpy, { passive: true });
            handleScrollSpy();
            return () => window.removeEventListener('scroll', handleScrollSpy);
          } else {
            setActiveSection(route);
          }
        }, [route, isHomePage]);

        return (
          <header className="fixed top-0 left-0 right-0 z-50 p-2 transition-all duration-300 ease-in-out">
            <div className={`container mx-auto max-w-7xl rounded-2xl px-6 transition-all duration-300 ease-in-out ${(isScrolled || isOpen) ? 'bg-white/60 backdrop-blur-lg shadow-xl' : 'bg-transparent'}`}>...
          </header>
        );
      };

      // Other component implementations...
    </script>
  </body>
